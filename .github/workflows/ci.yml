name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  # Lets a failing run be retried from the Actions tab without an empty commit.
  workflow_dispatch:

# A new push to the same branch makes the previous run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor the SDK targets; 24 is the current LTS line.
        node: ["22", "24"]
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # --ignore-scripts skips better-sqlite3's native build: it is a
      # devDependency used only for its types, and nothing under test imports
      # it. This keeps CI from compiling a C++ addon on every run.
      - name: Install
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
